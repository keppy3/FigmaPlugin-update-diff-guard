<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --panel-bg: #ffffff;
    --panel-border: #e0e0e0;
    --chrome-bg: #fbfbfb;
    --text: #1b1b1b;
    --text-muted: #75757a;
    --text-faint: #a5a5aa;
    --accent: #0c8ce9;
    --accent-strong: #0a72bd;
    --accent-bg: #e9f4fe;
    --success: #17915c;
    --success-bg: #e7f7ef;
    --warning: #a3690a;
    --warning-bg: #fdf1de;
    --warning-strong: #d98a17;
    --divider: #ededee;
    --row-hover: #f8f8f9;
    --danger: #d1453b;
    --danger-bg: rgba(209,69,59,0.12);
    --overlay: rgba(20,20,22,0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel-bg: #2b2c2e;
      --panel-border: #3d3e41;
      --chrome-bg: #313234;
      --text: #f1f1f2;
      --text-muted: #a7a7ad;
      --text-faint: #7a7a80;
      --accent: #4db2ff;
      --accent-strong: #7ccaff;
      --accent-bg: #123049;
      --success: #3fd693;
      --success-bg: #123626;
      --warning: #f0b452;
      --warning-bg: #3c2c11;
      --warning-strong: #f0b452;
      --divider: #3a3b3e;
      --row-hover: #313234;
      --danger: #ff8078;
      --danger-bg: rgba(255,128,120,0.14);
      --overlay: rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --panel-bg: #2b2c2e; --panel-border: #3d3e41; --chrome-bg: #313234; --text: #f1f1f2;
    --text-muted: #a7a7ad; --text-faint: #7a7a80; --accent: #4db2ff; --accent-strong: #7ccaff;
    --accent-bg: #123049; --success: #3fd693; --success-bg: #123626; --warning: #f0b452;
    --warning-bg: #3c2c11; --warning-strong: #f0b452; --divider: #3a3b3e; --row-hover: #313234;
    --danger: #ff8078; --danger-bg: rgba(255,128,120,0.14); --overlay: rgba(0,0,0,0.55);
  }
  :root[data-theme="light"] {
    --panel-bg: #ffffff; --panel-border: #e0e0e0; --chrome-bg: #fbfbfb; --text: #1b1b1b;
    --text-muted: #75757a; --text-faint: #a5a5aa; --accent: #0c8ce9; --accent-strong: #0a72bd;
    --accent-bg: #e9f4fe; --success: #17915c; --success-bg: #e7f7ef; --warning: #a3690a;
    --warning-bg: #fdf1de; --warning-strong: #d98a17; --divider: #ededee; --row-hover: #f8f8f9;
    --danger: #d1453b; --danger-bg: rgba(209,69,59,0.12); --overlay: rgba(20,20,22,0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Roboto, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
  }
  .hidden { display: none !important; }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .chrome { background: var(--chrome-bg); border-bottom: 1px solid var(--panel-border); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 8px; flex: none; }
  .chrome-sub { font-size: 12px; color: var(--text); font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chrome-reset-btn {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; flex: none;
  }
  .chrome-reset-btn:hover { background: var(--row-hover); color: var(--text); }
  .chrome-reset-btn[disabled] { opacity: 0.35; cursor: default; }
  .chrome-reset-btn svg { width: 14px; height: 14px; }

  .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* ---- Setup ---- */
  .setup { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .setup-intro { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }
  .setup-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .radio-group { display: flex; flex-direction: column; gap: 7px; }
  .radio-option { display: flex; flex-direction: column; gap: 2px; padding: 9px 11px 10px; border: 1px solid var(--panel-border); border-radius: 8px; cursor: pointer; }
  .radio-option:hover { background: var(--row-hover); }
  .radio-option.active { border-color: var(--accent); background: var(--accent-bg); }
  .radio-row { display: flex; align-items: center; gap: 9px; }
  .radio-row input[type="radio"] { width: 14px; height: 14px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .radio-row span { font-size: 12px; font-weight: 600; }
  .radio-caption { font-size: 10.5px; color: var(--text-muted); margin-left: 23px; }
  .setup-footnote { font-size: 10.5px; color: var(--text-faint); text-align: center; }

  .btn-big {
    width: 100%; height: 40px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-big:hover { background: var(--accent-strong); }
  .btn-big[disabled] { opacity: 0.42; cursor: default; background: var(--text-faint); }
  .btn-big.outline-warning { background: transparent; border: 1.5px solid var(--warning-strong); color: var(--warning-strong); }
  .btn-big.outline-warning:hover { background: var(--warning-bg); }
  .btn-big.outline-warning[disabled] { opacity: 0.4; border-color: var(--text-faint); color: var(--text-faint); background: transparent; }
  .btn-big.outline-danger { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }
  .btn-big.outline-danger:hover { background: var(--danger-bg); }
  .btn-big.outline-danger[disabled] { opacity: 0.4; border-color: var(--text-faint); color: var(--text-faint); background: transparent; }
  /* 一括「比較用インスタンスを配置」／「比較用インスタンスをすべて削除」を横並びにする組（フル幅ボタン2つを分け合う） */
  .btn-pair { display: flex; gap: 8px; }
  .btn-pair .btn-big { flex: 1; height: auto; min-height: 40px; padding: 6px 8px; font-size: 11px; line-height: 1.3; white-space: normal; }

  /* ---- Busy (bulk 更新／比較用インスタンスを配置／このまま更新 のみ) ---- */
  .busy { padding: 30px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--divider); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
  .spinner.sm { width: 13px; height: 13px; border-width: 2px; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--divider); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy-label { font-size: 12.5px; font-weight: 700; }
  .busy-step { font-size: 11px; color: var(--text-muted); min-height: 14px; }
  .progress-track { width: 100%; height: 4px; border-radius: 3px; background: var(--divider); overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.2s ease; }

  /* ---- Result screen ---- */
  #resultView { display: flex; flex-direction: column; min-height: 0; flex: 1; }

  .scan-progress { padding: 9px 14px; border-bottom: 1px solid var(--divider); background: var(--accent-bg); display: flex; flex-direction: column; gap: 6px; flex: none; }
  .scan-progress-row { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 600; color: var(--accent-strong); }
  .scan-progress .progress-track { background: color-mix(in srgb, var(--accent) 18%, var(--panel-bg)); height: 3px; }
  .scan-progress .progress-fill { background: var(--accent); }
  .scan-cancel-btn {
    margin-left: auto; padding: 3px 9px; font-size: 10px; font-weight: 600;
    color: var(--accent-strong); background: var(--panel-bg);
    border: 1px solid var(--accent); border-radius: 999px; cursor: pointer;
  }
  .scan-cancel-btn:hover { background: var(--row-hover); }
  .scan-cancel-btn[disabled] { opacity: 0.5; cursor: default; }

  .tabs { display: flex; border-bottom: 1px solid var(--panel-border); background: var(--chrome-bg); flex: none; }
  .tab { flex: 1; padding: 11px 8px; font-size: 12px; font-weight: 700; text-align: center; background: none; border: none; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .tab-count { font-weight: 600; }

  .tab-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .tab-panel.hidden { display: none; }

  .list-toolbar { display: flex; align-items: center; gap: 12px; padding: 7px 14px; border-bottom: 1px solid var(--divider); flex: none; }
  .list-toolbar-link { font-size: 10px; font-weight: 600; color: var(--accent-strong); background: none; border: none; cursor: pointer; padding: 2px 0; }
  .list-toolbar-link:hover { text-decoration: underline; }
  .list-toolbar-sep { color: var(--divider); font-size: 10px; }
  .list-toolbar-link.push-right { margin-left: auto; }

  .row-list { flex: 1; overflow-y: auto; min-height: 0; }
  .row { border-bottom: 1px solid var(--divider); }
  .row.enter { animation: rise 0.3s ease; }
  @media (prefers-reduced-motion: reduce) { .row.enter { animation: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .row:last-child { border-bottom: none; }
  .empty-state { padding: 22px 16px; text-align: center; font-size: 11px; color: var(--text-faint); display: flex; align-items: center; justify-content: center; gap: 7px; }

  .row-check { width: 14px; height: 14px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .row-check[disabled] { cursor: not-allowed; opacity: 0.5; }
  .row-name { font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-trailing { width: 16px; flex: none; display: flex; align-items: center; justify-content: center; }

  details.row > summary { list-style: none; }
  details.row > summary::-webkit-details-marker { display: none; }
  .row-summary { display: flex; align-items: center; gap: 9px; padding: 11px 14px; cursor: pointer; }
  .chevron { width: 12px; height: 12px; color: var(--text-faint); flex: none; transition: transform 0.15s ease; }
  details[open] .chevron { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }

  .row-detail { padding: 0 14px 14px 37px; display: flex; flex-direction: column; gap: 10px; }
  .preview-row { display: flex; align-items: flex-start; gap: 10px; }

  .thumb-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; }
  .preview-frame { width: 120px; height: 68px; border-radius: 7px; border: 1px solid var(--panel-border); background: var(--row-hover); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
  .preview-frame img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .thumb-label { font-size: 9.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }

  /* サムネイルの高さに合わせて「ジャンプ」ボタンだけを縦中央に置く（状態表示はthumb-labelに統合済み） */
  .side-col { height: 68px; display: flex; align-items: center; margin-left: auto; }

  .ghost-btn { font-size: 10.5px; font-weight: 600; color: var(--text); background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px 9px; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .ghost-btn:hover { background: var(--row-hover); }
  .ghost-btn[disabled] { opacity: 0.55; cursor: default; background: var(--row-hover); }
  .ghost-btn svg { width: 11px; height: 11px; flex: none; }
  .ghost-btn.accent { color: var(--accent-strong); border-color: var(--accent); }
  .ghost-btn.warn { color: var(--warning-strong); border-color: var(--warning-strong); }
  .ghost-btn.danger { color: var(--danger); border-color: var(--danger); }
  .row-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- 対象外（見た目差分なしタブのリスト内、他の行と同じアコーディオンで折りたたみ。
     デフォルト折りたたみ。チェックボックスは持たない） ---- */
  .excluded-summary { color: var(--text-faint); }
  .excluded-summary .row-name { color: inherit; font-weight: 700; }
  .excluded-rows { display: flex; flex-direction: column; padding-bottom: 4px; }
  .excluded-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 14px 7px 37px; border-top: 1px solid var(--divider); }
  .excluded-row:first-child { border-top: none; }
  .excluded-row .row-name { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .excluded-reason { font-size: 10px; color: var(--text-faint); flex: none; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tab-footer { border-top: 1px solid var(--panel-border); background: var(--chrome-bg); flex: none; }
  .tab-footer-actions { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }

  .toast {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--panel-bg); font-size: 11.5px; font-weight: 500;
    padding: 9px 14px; border-radius: 7px; opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease; max-width: 90%; text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- このまま更新の確認ダイアログ ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal-box {
    width: 100%; max-width: 320px; background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 16px; box-shadow: 0 20px 48px rgba(0,0,0,0.25);
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal-title { font-size: 12.5px; font-weight: 700; }
  .modal-body { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }
  .modal-checkbox-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text); }
  .modal-checkbox-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .modal-actions .btn-big { width: auto; height: 32px; padding: 0 16px; font-size: 11px; }
</style>
</head>
<body>
  <div class="chrome">
    <span class="chrome-sub" id="chromeSub">アイドル</span>
    <button class="chrome-reset-btn" id="resetBtn" title="最初からやり直す" aria-label="最初からやり直す">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 1 1.6 3.7M3 8V4M3 8h4"/></svg>
    </button>
  </div>

  <div class="panel-body">

    <!-- ① スキャン前画面 -->
    <div class="setup" id="setupView">
      <div class="setup-intro">ライブラリの更新があるインスタンスを検出します。スキャンする範囲を選んでください。</div>
      <div class="setup-label">スキャン範囲</div>
      <div class="radio-group" id="radioGroup">
        <label class="radio-option active" data-scope="selection">
          <span class="radio-row"><input type="radio" name="scope" value="selection" checked><span>選択範囲</span></span>
          <span class="radio-caption">選択したフレーム／グループ等の内部も含む</span>
        </label>
        <label class="radio-option" data-scope="page">
          <span class="radio-row"><input type="radio" name="scope" value="page"><span>現在のページ</span></span>
          <span class="radio-caption">選択状態に関わらずページ全体</span>
        </label>
        <label class="radio-option" data-scope="all">
          <span class="radio-row"><input type="radio" name="scope" value="all"><span>すべてのページ</span></span>
          <span class="radio-caption">ファイル内の全ページ</span>
        </label>
      </div>
      <button class="btn-big" id="scanBtn">スキャン</button>
      <div class="setup-footnote">対象数が多いとスキャンに時間がかかることがあります。見つかり次第、順次リストに表示します</div>
    </div>

    <!-- 一括「更新」／一括「比較用インスタンスを配置」／一括「このまま更新」実行時のみのビジー画面 -->
    <div class="busy hidden" id="busyView">
      <div class="spinner"></div>
      <div class="busy-label" id="busyLabel">更新しています</div>
      <div class="busy-step" id="busyStep"></div>
      <div class="progress-track"><div class="progress-fill" id="busyProgress"></div></div>
    </div>

    <!-- ③ スキャン結果リスト -->
    <div class="hidden" id="resultView">

      <div class="scan-progress hidden" id="scanProgressStrip">
        <div class="scan-progress-row">
          <span class="spinner sm"></span>
          <span id="scanProgressText">確認中… 0 / 0</span>
          <button class="scan-cancel-btn" id="cancelScanBtn">キャンセル</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="scanProgressFill"></div></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="clean">✅️ 見た目差分なし <span class="tab-count" id="cleanCount">(0)</span></button>
        <button class="tab" data-tab="diff">⚠️ 見た目差分あり <span class="tab-count" id="diffCount">(0)</span></button>
      </div>

      <div class="tab-panel" data-panel="clean">
        <div class="list-toolbar">
          <button class="list-toolbar-link" id="cleanSelectAll">すべて選択</button>
          <span class="list-toolbar-sep">|</span>
          <button class="list-toolbar-link" id="cleanSelectNone">すべて解除</button>
          <button class="list-toolbar-link push-right" id="cleanExpandAll">すべて展開</button>
          <span class="list-toolbar-sep">|</span>
          <button class="list-toolbar-link" id="cleanCollapseAll">すべて折りたたむ</button>
        </div>
        <div class="row-list" id="cleanList"></div>
        <div class="tab-footer">
          <div class="tab-footer-actions">
            <button class="btn-big" id="updateBtn"><span id="updateBtnLabel">一括更新（0件）</span></button>
          </div>
        </div>
      </div>

      <div class="tab-panel hidden" data-panel="diff">
        <div class="list-toolbar">
          <button class="list-toolbar-link" id="diffSelectAll">すべて選択</button>
          <span class="list-toolbar-sep">|</span>
          <button class="list-toolbar-link" id="diffSelectNone">すべて解除</button>
          <button class="list-toolbar-link push-right" id="diffExpandAll">すべて展開</button>
          <span class="list-toolbar-sep">|</span>
          <button class="list-toolbar-link" id="diffCollapseAll">すべて折りたたむ</button>
        </div>
        <div class="row-list" id="diffList"></div>
        <div class="tab-footer">
          <div class="tab-footer-actions">
            <button class="btn-big" id="forceUpdateBtn"><span id="forceUpdateBtnLabel">このまま一括更新（0件）</span></button>
            <div class="btn-pair">
              <button class="btn-big outline-warning" id="placeLatestBtn"><span id="placeLatestBtnLabel">比較用インスタンスを一括配置（0件）</span></button>
              <button class="btn-big outline-danger" id="clearAllLatestBtn"><span id="clearAllLatestBtnLabel">比較用インスタンスをすべて削除（0件）</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay hidden" id="confirmOverlay">
    <div class="modal-box">
      <div class="modal-title">差分を許容して更新</div>
      <div class="modal-body" id="confirmBody"></div>
      <label class="modal-checkbox-row hidden" id="confirmRemoveLatestRow">
        <input type="checkbox" id="confirmRemoveLatest" checked>
        <span>配置中の比較用インスタンスを削除する</span>
      </label>
      <div class="modal-actions">
        <button class="ghost-btn" id="modalCancel">キャンセル</button>
        <button class="btn-big" id="modalConfirm">続行</button>
      </div>
    </div>
  </div>

  <script>
